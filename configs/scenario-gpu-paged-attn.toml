# ===========================================================================
# scenario-gpu-paged-attn.toml
#
# Purpose: CUDA paged-attention engine (CudaEngine) on a single GPU.
#          This uses the vLLM-style paged KV allocator, not the llama.cpp
#          GPU offload path (inference.cuda).
#
# Requirements:
#   - CUDA 12.x capable GPU (sm_80+ recommended, sm_89+ for FP8 KV)
#   - Engine built with CUDA support (-DTRUELLM_CUDA=ON)
#
# Usage: truellm --config configs/scenario-gpu-paged-attn.toml --backend cuda
# ===========================================================================

[server]
host           = "0.0.0.0"
port           = 9099
api_key        = ""
max_concurrent = 32

[model]
path          = "./models/llama-3.1-8b-instruct-q4_k_m.gguf"
alias         = "llama-3.1-8b-cuda"
chat_template = "llama3"

[inference]
backend         = "cuda"
context_size    = 8192
flash_attention = true
mmap            = true

[inference.kv_cache]
type_k = "f16"
type_v = "f16"

# GgmlEngine CUDA offload (used when falling back from CudaEngine)
[inference.cuda]
gpu_layers             = -1
gpu_memory_utilization = 0.90

# CudaEngine paged KV pool settings
[inference.cuda_engine]
paged_kv_block_size       = 16      # 16 tokens per block (good default for most models)
max_num_blocks            = 0       # 0 = auto-size from available VRAM
max_num_seqs              = 256     # Maximum concurrent sequences
num_cuda_streams          = 3       # Prefill / decode / copy stream pool
use_fp8_kv                = false   # Enable for Ada/Hopper (sm_89+) to halve KV VRAM
gpu_memory_utilization    = 0.90
tensor_parallel_size      = 1       # Single GPU; set >1 only with NCCL multi-GPU build
enforce_eager             = false   # Keep CUDA graphs enabled for decode speed
cuda_graph_max_batch_size = 8
attention_layout          = "paged"

[inference.batching]
enabled   = true
max_seqs  = 64
max_queue = 512
kv_unified = true

[sampling]
temperature = 0.7
top_p       = 0.9
max_tokens  = 2048
seed        = -1

[logging]
level  = "info"
format = "text"

[hardware]
cpu_threads = 4

[hardware.gpu]
enabled        = true
device_id      = 0
backend_api    = "cuda"

[hardware.offload]
use_gpu_vram         = true
gpu_layers           = -1
vram_budget_fraction = 0.90

[hardware.guardrails]
preset = "strict"

[runtime]
engine = "cuda12-llama-cpp"
