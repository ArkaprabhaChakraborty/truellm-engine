# ============================================================================
# cuda-kivi-compression.toml — megakernel + KiVi KV cache + Presis scoring
# ============================================================================
# Exercises:
#   - megakernel cooperative launch with attention-weight save (Presis needs it)
#   - KiVi INT4 group-quantized KV cache (see kivi_cache.cu)
#   - Presis attention-based token pruning (falls back to TF-IDF when attn is
#     unavailable — see compression_scoring_pass.cpp)
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 90000
max_concurrent     = 4

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b-kivi"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 4096
batch_size      = 512
ubatch_size     = 512
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "q8_0"
type_v = "q8_0"

[inference.batching]
enabled   = true
max_seqs  = 4
max_queue = 64

[inference.cuda]
gpu_layers               = -1
main_gpu                 = 0
gpu_memory_utilization   = 0.85   # leave headroom for KiVi compressed pool
use_flash_attention_cuda = true

[inference.cuda_engine]
paged_kv_block_size       = 16
max_num_seqs              = 4
num_cuda_streams          = 3
gpu_memory_utilization    = 0.85
enforce_eager             = true
use_megakernel            = true
megakernel_save_attn      = true   # required for Presis scoring
megakernel_save_hidden    = false  # ToMe off
attention_layout          = "paged"

# ---- Compression pipeline -------------------------------------------------
[inference.compression]
enabled  = true
pipeline = "presis+kivi"

[inference.compression.presis]
enabled             = true
threshold           = 0.70   # trigger when seq > 70% of context budget
keep_fraction       = 0.60   # retain top 60% of tokens by attention mass
importance_layers   = 4
fallback_tfidf      = true
max_seqlen_for_attn = 2048

[inference.compression.kv_kivi]
enabled           = true
bits              = 4
residual_length   = 8        # ≤ KIVI_MAX_OUTLIERS (64)
key_granularity   = "per_channel"
value_granularity = "per_token"
pre_rope_keys     = true

[sampling]
temperature    = 0.0
top_p          = 1.0
repeat_penalty = 1.0
max_tokens     = 64
seed           = 42

[logging]
level  = "info"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.85

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
