# ============================================================================
# cuda-megakernel.toml — megakernel cooperative launch, no compression
# ============================================================================
# Exercises the Phase M4 megakernel path (single grid.sync() kernel) without
# any KV compression or token pruning.  Requires sm_70+ and a device that
# reports cudaDevAttrCooperativeLaunch == 1.  Falls back to the legacy
# ggml+vllm pipeline automatically when the probe in cuda_engine.cpp fails.
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 60000
max_concurrent     = 4

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b-megakernel"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 4096
batch_size      = 512
ubatch_size     = 512
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "q8_0"
type_v = "q8_0"

[inference.batching]
enabled   = true
max_seqs  = 4
max_queue = 64

[inference.cuda]
gpu_layers               = -1
main_gpu                 = 0
gpu_memory_utilization   = 0.90
use_flash_attention_cuda = true

# Megakernel path — single cooperative-launch kernel for the full token step.
[inference.cuda_engine]
paged_kv_block_size       = 16
max_num_seqs              = 4
num_cuda_streams          = 3
gpu_memory_utilization    = 0.90
enforce_eager             = true    # skip CUDA graph capture so megakernel path is primary
use_megakernel            = true
megakernel_save_attn      = false
megakernel_save_hidden    = false
attention_layout          = "paged"

[sampling]
temperature    = 0.0       # deterministic for integration checks
top_p          = 1.0
top_k          = 0
repeat_penalty = 1.0
max_tokens     = 64
seed           = 42

[logging]
level  = "info"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.90

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
