# ===========================================================================
# profiles/server.toml
#
# Profile: server
# Target:  Headless production server — multi-user, JSON logging, strict limits.
#
# This file is a ready-to-copy base config for the "server" profile.
# Equivalent to: truellm --profile server --config your.toml
#
# Key characteristics:
#   - Binds on all interfaces (0.0.0.0)
#   - API key required — set via environment variable
#   - CUDA backend with large context
#   - mlock = true to prevent model weights from being swapped
#   - JSON logging for log aggregators (Datadog, Loki, Splunk)
#   - Strict guardrails to prevent resource abuse
#   - 8 concurrent users
# ===========================================================================

profile = "server"

[server]
host           = "0.0.0.0"
port           = 8080
api_key        = "${ENV:TRUELLM_API_KEY}"
max_concurrent = 8

[model]
path          = "./models/llama-3.1-8b-instruct-q4_k_m.gguf"
chat_template = "llama3"

[inference]
backend         = "cuda"
context_size    = 32768
flash_attention = true
mmap            = true
mlock           = true    # prevent swap on production

[inference.kv_cache]
type_k = "f16"
type_v = "f16"

[inference.cuda]
gpu_layers             = -1
gpu_memory_utilization = 0.90

[inference.batching]
enabled    = true
max_seqs   = 8
max_queue  = 256
kv_unified = true

[sampling]
temperature = 0.7
top_p       = 0.95
max_tokens  = 2048
seed        = -1

[logging]
level      = "warn"
format     = "json"
timestamps = true

[hardware]
cpu_threads = 0

[hardware.gpu]
enabled   = true
device_id = 0

[hardware.offload]
use_gpu_vram         = true
gpu_layers           = -1
vram_budget_fraction = 0.90

[hardware.guardrails]
preset = "strict"

[runtime]
engine = "cuda12-llama-cpp"
