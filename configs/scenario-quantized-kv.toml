# ===========================================================================
# scenario-quantized-kv.toml
#
# Purpose: Maximise context length by quantizing the KV cache.
#          Use this when loading a large model with limited VRAM/RAM.
#
#   KV type comparison (8192 tokens, 32 layers, 32 heads, head_dim=128):
#     f16   -> 32 GiB   (full precision)
#     q8_0  ->  8 GiB   (8-bit quantized, ~0.2% quality loss typical)
#     q4_0  ->  4 GiB   (4-bit quantized, noticeable quality loss on long ctx)
#
# Usage: truellm --config configs/scenario-quantized-kv.toml
# ===========================================================================

[server]
host           = "127.0.0.1"
port           = 9099
api_key        = ""
max_concurrent = 4

[model]
path          = "./models/llama-3.1-8b-instruct-q4_k_m.gguf"
alias         = "llama-3.1-8b-longctx"
chat_template = "llama3"

[inference]
backend      = "cpu"
context_size = 32768             # Extended context window
batch_size   = 512
threads      = 0
mmap         = true
mlock        = false

# Q8_0 quantization for both key and value caches.
# Halves the KV footprint vs F16 with minimal quality impact.
[inference.kv_cache]
type_k  = "q8_0"
type_v  = "q8_0"
size_mb = 0                      # 0 = automatic sizing

[inference.batching]
enabled  = false
max_seqs = 1

[sampling]
temperature = 0.7
top_p       = 0.95
max_tokens  = 8192
seed        = -1

[logging]
level  = "info"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.offload]
use_gpu_vram         = false     # CPU-only; no GPU offload
use_system_ram       = true
gpu_layers           = 0

[hardware.guardrails]
preset = "balanced"

[runtime]
engine = "cpu-llama-cpp"
