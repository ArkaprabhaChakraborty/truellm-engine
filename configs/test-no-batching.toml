# ============================================================================
# TEST: Continuous batching DISABLED — sequential baseline
#
# Use this to compare throughput against test-batching-stress.toml.
# Each request is processed one at a time; no concurrent decode steps.
#
# Run:
#   .\build\windows-cuda\bin\truellm-server.exe -c configs\test-no-batching.toml -v
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 60000
max_concurrent     = 1             # single slot — requests queue at HTTP layer

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 4096
batch_size      = 512
ubatch_size     = 512
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "q8_0"
type_v = "q8_0"

[inference.batching]
enabled   = false           # <<< KEY: scheduler disabled, pure serial execution
max_seqs  = 1
max_queue = 1

[inference.cuda]
gpu_layers             = -1
main_gpu               = 0
tensor_split           = []
gpu_memory_utilization = 0.90

[sampling]
temperature    = 0.6
top_p          = 0.95
top_k          = 40
min_p          = 0.05
repeat_penalty = 1.1
max_tokens     = 256
seed           = -1

[logging]
level  = "debug"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.90

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
