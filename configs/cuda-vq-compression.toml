# ============================================================================
# cuda-vq-compression.toml — megakernel + VQ codebook KV cache + ToMe merging
# ============================================================================
# Exercises:
#   - megakernel cooperative launch with hidden-state save (ToMe needs it)
#   - Vector-quantized KV cache (vq_cache.cu) with k-means seeded codebook
#     (codebook_init.cu)
#   - Token Merging (ToMe) bipartite hidden-state pairing
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 90000
max_concurrent     = 4

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b-vq"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 4096
batch_size      = 512
ubatch_size     = 512
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "q8_0"
type_v = "q8_0"

[inference.batching]
enabled   = true
max_seqs  = 4
max_queue = 64

[inference.cuda]
gpu_layers               = -1
main_gpu                 = 0
gpu_memory_utilization   = 0.85
use_flash_attention_cuda = true

[inference.cuda_engine]
paged_kv_block_size       = 16
max_num_seqs              = 4
num_cuda_streams          = 3
gpu_memory_utilization    = 0.85
enforce_eager             = true
use_megakernel            = true
megakernel_save_attn      = false
megakernel_save_hidden    = true   # required for ToMe
attention_layout          = "paged"

# ---- Compression pipeline -------------------------------------------------
[inference.compression]
enabled  = true
pipeline = "tome+vq"

[inference.compression.tome]
enabled          = true
r                = 8            # pairs merged per application
start_layer      = 0
apply_all_layers = false
merge_mode       = "mean"

[inference.compression.kv_vq]
enabled             = true
codebook_size       = 256       # well under VQ_MAX_CODEBOOK_SIZE (65535)
update_rate         = 0.001
residual_depth      = 1
outlier_tracing     = true
disable_in_subcalls = true

[sampling]
temperature    = 0.0
top_p          = 1.0
repeat_penalty = 1.0
max_tokens     = 64
seed           = 42

[logging]
level  = "info"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.85

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
