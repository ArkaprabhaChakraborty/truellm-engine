# ============================================================================
# TrueLLM — Nemotron-3-Nano-4B GPU config
# ============================================================================
# Model:   NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf  (~2.7 GB VRAM)
# Backend: CUDA (RTX 5090 — full offload)
# Build:   windows-cuda preset (cmake --preset windows-cuda)
# Run:
#   .\build\windows-cuda\bin\truellm-server.exe -c configs\nemotron-cuda.toml -v
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""             # no auth for local testing
cors_origins       = ["*"]
request_timeout_ms = 60000          # generous — first token can be slow
max_concurrent     = 4              # matches inference.batching.max_seqs

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b"
chat_template = "chatml"            # Nemotron uses ChatML format

[inference]
backend         = "cuda"
context_size    = 4096              # Nemotron-3-Nano trained context length
batch_size      = 512
ubatch_size     = 512
threads         = 0                 # ignored when fully on GPU
flash_attention = true              # FA2 — RTX 5090 fully supports this
mmap            = true
mlock           = false

[inference.kv_cache]
type_k  = "q8_0"   # halves KV VRAM vs f16; safe on CUDA
type_v  = "q8_0"

[inference.batching]
enabled   = true    # continuous batching — multiple requests decoded in parallel
max_seqs  = 4       # 4 concurrent sequences (conservative for 4B model)
max_queue = 64      # pending request buffer

[inference.cuda]
gpu_layers               = -1       # offload all 32 layers + embeddings
main_gpu                 = 0
tensor_split             = []       # single GPU
gpu_memory_utilization   = 0.90
use_flash_attention_cuda = true

[sampling]
temperature       = 0.6             # Nemotron recommended temp
top_p             = 0.95
top_k             = 40
min_p             = 0.05
repeat_penalty    = 1.1
frequency_penalty = 0.0
presence_penalty  = 0.0
max_tokens        = 512
seed              = -1

[logging]
level  = "debug"
format = "text"

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0              # 0 = auto-detect
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1           # same as inference.cuda.gpu_layers — fill VRAM
vram_budget_fraction = 0.90

[hardware.guardrails]
preset           = "relaxed"        # 4B model is tiny, no need for strict limits
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
