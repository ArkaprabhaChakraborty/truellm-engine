# ============================================================================
# TEST: FP8 KV cache (Ada Lovelace sm_89+ — RTX 4090 / RTX 5090 / H100)
# ============================================================================
# Targets the fp8_utils.cuh fix (TRUELLM_CUDA_SM89_PLUS guard restructuring)
# and the cache_kernels.cu kernel body __CUDA_ARCH__ guard.
#
# use_fp8_kv=true halves KV VRAM: F16 (2 bytes) → FP8 E4M3 (1 byte).
# bytes_per_block() uses elem_size=1 in this path.
#
# What this exercises:
#   - FP8 allocator path: bytes_per_block() with fp8_enabled_=true
#   - convert_fp8_kernel compiles and runs on sm_89+ without CUDA_ARCH errors
#   - scaled_fp8_quant / scaled_fp8_dequant kernels (fp8_gemm.cu)
#   - ~2x more KV blocks fit in the same VRAM budget vs F16 (verify in logs)
#   - Per-layer FP8 KV addressing in kv_layer_k_ptr / kv_layer_v_ptr
#
# Requirements: GPU with sm_89+ (RTX 4090 / RTX 5090 / H100 / H200).
# On sm_75/sm_80/sm_86 the engine will fall back or error — use test-cuda-paged-kv.toml.
#
# Run:
#   .\build\windows-cuda\bin\truellm-server.exe -c configs\test-cuda-fp8-kv.toml -v
#
# In logs, FP8 pool should be ~2x bigger than F16 pool with same gpu_memory_utilization:
#   [CudaAllocator] FP8 KV: elem_size=1
#   [CudaAllocator] Auto-sized pool: ~2X blocks vs F16 run
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9094
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 90000
max_concurrent     = 8

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 4096
batch_size      = 512
ubatch_size     = 512
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "f16"      # weights stay F16; KV cache is FP8 via use_fp8_kv below
type_v = "f16"

[inference.cuda_engine]
paged_kv_block_size       = 16
max_num_blocks            = 0        # auto: FP8 pool should hold ~2x more blocks than F16
max_num_seqs              = 8
num_cuda_streams          = 3
use_fp8_kv                = true     # <<< KEY: enables FP8 E4M3 KV cache
gpu_memory_utilization    = 0.85
tensor_parallel_size      = 1
enforce_eager             = true
cuda_graph_max_batch_size = 1
attention_layout          = "paged"

[inference.cuda]
gpu_layers             = -1
main_gpu               = 0
tensor_split           = []
gpu_memory_utilization = 0.85

[inference.batching]
enabled   = true
max_seqs  = 8
max_queue = 64

[sampling]
temperature    = 0.7
top_p          = 0.95
top_k          = 40
min_p          = 0.05
repeat_penalty = 1.1
max_tokens     = 256
seed           = -1

[logging]
level           = "debug"
format          = "text"
timestamps      = true
source_location = true

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0
resource_monitor_interval_ms = 1000

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.85

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
