# ============================================================================
# TEST: Per-layer paged KV cache — basic correctness
# ============================================================================
# Targets the per-layer KV layout fix: each transformer layer now gets its
# own slice of the device pool via kv_layer_k_ptr(l) / kv_layer_v_ptr(l).
#
# What this exercises:
#   - CudaAllocator bytes_per_block() includes num_layers_ factor
#   - Auto-pool sizing (max_num_blocks=0) divides budget by correct per-block size
#   - run_forward() uses correct per-layer KV pointers in the layer loop
#   - paged_attention_v1 path (ctx=1024 → 1024/16=64 partitions, just above v1 threshold)
#   - reshape_and_cache writes into correct layer offset on device
#
# Run:
#   .\build\windows-cuda\bin\truellm-server.exe -c configs\test-cuda-paged-kv.toml -v
#
# Watch for in logs:
#   [CudaAllocator] Auto-sized pool: N blocks
#   [CudaModel] dims: layers=32 heads=32(kv=8) ...
#   [CudaEngine] Paged KV: block_size=16 num_blocks=N
# ============================================================================

[server]
host               = "127.0.0.1"
port               = 9099
api_key            = ""
cors_origins       = ["*"]
request_timeout_ms = 60000
max_concurrent     = 4

[model]
path          = "C:\\Users\\chakr\\.lmstudio\\models\\lmstudio-community\\NVIDIA-Nemotron-3-Nano-4B-GGUF\\NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf"
alias         = "nemotron-3-nano-4b"
chat_template = "chatml"

[inference]
backend         = "cuda"
context_size    = 1024          # short: forces paged_attention_v1 path (1024/16=64 > 32)
batch_size      = 256
ubatch_size     = 256
threads         = 0
flash_attention = true
mmap            = true
mlock           = false

[inference.kv_cache]
type_k = "f16"
type_v = "f16"

[inference.cuda_engine]
paged_kv_block_size       = 16       # 16 tokens/block — matches default vLLM config
max_num_blocks            = 0        # auto-size: triggers the bytes_per_block() fix
max_num_seqs              = 4
num_cuda_streams          = 3
use_fp8_kv                = false
gpu_memory_utilization    = 0.80
tensor_parallel_size      = 1
enforce_eager             = true     # no graph capture — isolate allocator behaviour
cuda_graph_max_batch_size = 1
attention_layout          = "paged"

[inference.cuda]
gpu_layers             = -1
main_gpu               = 0
tensor_split           = []
gpu_memory_utilization = 0.80

[inference.batching]
enabled   = true
max_seqs  = 4
max_queue = 32

[sampling]
temperature    = 0.0      # greedy — deterministic output for diff checking
top_p          = 1.0
top_k          = 1
min_p          = 0.0
repeat_penalty = 1.0
max_tokens     = 64
seed           = 1234

[logging]
level           = "debug"
format          = "text"
timestamps      = true
source_location = true    # see file:line in allocator + engine

[hardware]
cpu_threads = 0
max_ram_gb  = 0.0
resource_monitor_interval_ms = 1000

[hardware.gpu]
enabled          = true
device_id        = 0
name_hint        = "RTX 5090"
vram_capacity_gb = 0.0
backend_api      = "cuda"

[hardware.offload]
use_gpu_vram         = true
use_system_ram       = true
gpu_layers           = -1
vram_budget_fraction = 0.80

[hardware.guardrails]
preset           = "relaxed"
allow_overcommit = false

[runtime]
engine = "cuda12-llama-cpp"

[plugins]
enabled = false
